{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>CyberSafe Admin Dashboard</title>
  <meta name="description" content="Professional cybersecurity management platform for monitoring and managing digital security operations">
  <meta name="keywords" content="cybersecurity, admin dashboard, digital security, cyber safety">

  <!-- Favicons -->
  <link href="/static/assets/img/favicon.png" rel="icon">
  <link href="/static/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="/static/assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="/static/assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="/static/assets/css/main.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #3b82f6;
      --secondary-color: #64748b;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    /* Enhanced Header Styling */
    #header {
      background:var(--background-color) !important;
      backdrop-filter: blur(20px);
{#      border-bottom: 1px solid var(--gray-200);#}
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    #header.scrolled {
      background:var(--background-color) !important;
      box-shadow: var(--shadow-lg);
    }

    .header-container {
      background-color:white !important;
      padding: 0.75rem 2rem;
    }

    /* Logo Styling */
    .logo {
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .logo:hover {
      transform: translateY(-1px);
    }

    .sitename {
      font-family: 'Inter', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: -0.025em;
      position: relative;
    }

    .sitename::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      transition: width 0.3s ease;
    }

    .logo:hover .sitename::after {
      width: 100%;
    }

    /* Navigation Styling */
    .navmenu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .navmenu li {
      position: relative;
    }

    .navmenu a {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--gray-700);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navmenu a::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      opacity: 0;
      border-radius: 8px;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .navmenu a:hover {
      color: white;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .navmenu a:hover::before {
      opacity: 1;
    }

    /* Dropdown Styling */
    .dropdown {
      position: relative;
    }

    .dropdown ul {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--gray-200);
      min-width: 220px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      padding: 0.5rem 0;
      margin-top: 0.5rem;
    }

    .dropdown:hover ul {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown ul li {
      width: 100%;
    }

    .dropdown ul a {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      margin: 0 0.5rem;
      width: calc(100% - 1rem);
      font-size: 0.9rem;
      border: none;
      background: transparent;
    }

    .dropdown ul a:hover {
      background: var(--gray-50);
      color: var(--primary-color);
      transform: translateX(4px);
    }

    .toggle-dropdown {
      font-size: 0.8rem;
      transition: transform 0.3s ease;
    }

    .dropdown:hover .toggle-dropdown {
      transform: rotate(180deg);
    }

    /* Get Started Button */
    .btn-getstarted {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn-getstarted::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn-getstarted:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      color: white;
      text-decoration: none;
    }

    .btn-getstarted:hover::before {
      left: 100%;
    }

    /* Mobile Navigation */
    .mobile-nav-toggle {
      display: none;
      font-size: 1.5rem;
      color: var(--gray-700);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mobile-nav-toggle:hover {
      color: var(--primary-color);
      transform: scale(1.1);
    }

    /* Admin Badge */
    .admin-badge {
      background: linear-gradient(135deg, var(--success-color), #059669);
      color: white;
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 0.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .navmenu ul {
        gap: 1.5rem;
      }

      .header-container {
        padding: 0.75rem 1.5rem;
      }
    }

    @media (max-width: 992px) {
      .navmenu ul {
        gap: 1rem;
      }

      .navmenu a {
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
      }

      .btn-getstarted {
        padding: 0.5rem 1.25rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 768px) {
      .mobile-nav-toggle {
        display: block;
      }

      .navmenu {
        display: none;
      }

      .header-container {
        padding: 0.75rem 1rem;
      }

      .sitename {
        font-size: 1.5rem;
      }
    }

    /* Enhanced Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #header {
      animation: fadeInDown 0.6s ease-out;
    }

    /* Accessibility Improvements */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .navmenu a:focus,
    .btn-getstarted:focus,
    .logo:focus {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    /* Status Indicator */
    .status-indicator {
      width: 8px;
      height: 8px;
      background: var(--success-color);
      border-radius: 50%;
      display: inline-block;
      margin-left: 0.5rem;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
  </style>
</head>

<body class="index-page">

  <header id="header" class="header d-flex align-items-center fixed-top" >
    <div class="header-container container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

      <a href="/cyber_home" class="logo d-flex align-items-center me-auto me-xl-0">
        <!-- Uncomment the line below if you also wish to use an image logo -->
        <!-- <img src="/static/assets/img/logo.png" alt="CyberSafe Logo"> -->
        <h1 class="sitename">
          ZenBook
          <span class="admin-badge">Admin</span>
        </h1>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="/cyber_home">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
            <span class="status-indicator"></span>
          </a></li>



          <li class="dropdown">
            <a href="#">
              <i class="bi bi-gear"></i>
              <span> Actions</span>
              <i class="bi bi-chevron-down toggle-dropdown"></i>
            </a>
            <ul>
              <li><a href="/cyber_home">
                <i class="bi bi-person-plus"></i>
                <span>Profile</span>
              </a></li>


            </ul>
          </li>



        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <a class="btn-getstarted" href="/logout_view">
        <i class="bi bi-person-circle"></i>
        <span>Logout</span>
      </a>

    </div>
  </header>

  {% block content %}
  {% endblock %}

  <!-- Vendor JS Files -->
  <script src="/static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/static/assets/vendor/aos/aos.js"></script>
  <script src="/static/assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="/static/assets/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Main JS File -->
  <script src="/static/assets/js/main.js"></script>

  <script>
    // Enhanced header scroll effect
    window.addEventListener('scroll', function() {
      const header = document.getElementById('header');
      if (window.scrollY > 100) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    // Mobile navigation toggle
    document.addEventListener('DOMContentLoaded', function() {
      const mobileNavToggle = document.querySelector('.mobile-nav-toggle');
      const navmenu = document.querySelector('.navmenu');

      if (mobileNavToggle) {
        mobileNavToggle.addEventListener('click', function() {
          navmenu.classList.toggle('mobile-nav-active');
          this.classList.toggle('bi-list');
          this.classList.toggle('bi-x');
        });
      }
    });

    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>

</body>
</html>
