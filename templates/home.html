<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Safe Social Media Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f4f4f4;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header .nav-buttons a {
            text-decoration: none;
            color: white;
            background-color: #3498db;
            padding: 10px 18px;
            border-radius: 6px;
            margin-left: 10px;
            transition: background-color 0.3s;
        }

        .header .nav-buttons a:hover {
            background-color: #1d6fa5;
        }

        .main {
            text-align: center;
            margin-top: 100px;
        }

        .main h2 {
            font-size: 32px;
            color: #2c3e50;
        }

        .main p {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cyber Safe Social Media</h1>
        <div class="nav-buttons">
            <a href="{% url 'login' %}">Login</a>
            <a href="">Register</a>
            <a href="/admin_add_cybercell">admin_add_cybercell</a>
        </div>
    </div>

    <div class="main">

        <p>Join us in creating a secure and respectful online community.</p>
    </div>

</body>
</html>
